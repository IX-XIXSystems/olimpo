<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Olimpo Pizzas Delivery — Fraiburgo, SC</title>
  <meta name="description" content="Cardápio digital da Olimpo Pizzas Delivery em Fraiburgo - SC. Pizzas artesanais, calzones e combos.">
  
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css?v=6">

  <style>
    /* =========================================================
       COREOGRAFÍA DE ENTRADA CINEMATOGRÁFICA & LOGO 3D FLUIDO
       ========================================================= */
    :root {
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Telón inicial ultra rápido que se desvanece suavemente */
    .page-curtain {
      position: fixed;
      inset: 0;
      background: #08090B;
      z-index: 9999;
      pointer-events: none;
      animation: curtainFade 0.85s var(--ease-out-expo) 0.12s forwards;
    }

    @keyframes curtainFade {
      0% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }

    /* Cascada de entrada para cada bloque de la página */
    .seq-1 { opacity: 0; animation: slideBlurIn 0.8s var(--ease-out-expo) 0.15s forwards; }
    .seq-2 { opacity: 0; animation: logoGrandEnter 1s var(--ease-out-expo) 0.22s forwards; }
    .seq-3 { opacity: 0; animation: slideBlurIn 0.85s var(--ease-out-expo) 0.36s forwards; }
    .seq-4 { opacity: 0; animation: slideBlurIn 0.85s var(--ease-out-expo) 0.46s forwards; }
    .seq-5 { opacity: 0; animation: slideBlurIn 0.85s var(--ease-out-expo) 0.56s forwards; }
    .seq-6 { opacity: 0; animation: slideBlurIn 0.85s var(--ease-out-expo) 0.66s forwards; }
    .seq-7 { opacity: 0; animation: slideBlurIn 0.9s var(--ease-out-expo) 0.76s forwards; }

    @keyframes slideBlurIn {
      0% {
        opacity: 0;
        transform: translateY(18px);
        filter: blur(6px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @keyframes logoGrandEnter {
      0% {
        opacity: 0;
        transform: scale(0.72) rotate(-8deg);
        filter: blur(10px);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
        filter: blur(0);
      }
    }

    /* Header limpio */
    .header-inner {
      height: 64px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      gap: 8px !important;
    }
    .brand {
      display: flex !important;
      align-items: center !important;
      gap: 10px !important;
      min-width: 0 !important;
    }
    .header-logo-wrap {
      width: 38px !important;
      height: 38px !important;
      border-radius: 50% !important;
      overflow: hidden !important;
      border: 1px solid rgba(245, 197, 24, 0.45) !important;
      background: #000 !important;
      flex-shrink: 0 !important;
      box-shadow: 0 0 14px rgba(245, 197, 24, 0.2) !important;
      transition: transform 0.4s var(--ease-spring) !important;
    }
    .brand:hover .header-logo-wrap { transform: scale(1.08) rotate(6deg) !important; }
    .header-logo-img { width: 38px !important; height: 38px !important; object-fit: cover !important; }
    .brand-stack { display: flex !important; flex-direction: column !important; line-height: 1.15 !important; }
    .brand-name { font-size: 1rem !important; font-weight: 700 !important; letter-spacing: 0.08em !important; text-transform: uppercase !important; }
    .brand-city { font-size: 0.66rem !important; color: #9CA3AF !important; }
    .header-right { display: flex !important; align-items: center !important; gap: 6px !important; flex-shrink: 0 !important; }
    .union-emblem, .icon-pill {
      width: 32px !important;
      height: 32px !important;
      border-radius: 50% !important;
      background: #101216 !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      flex-shrink: 0 !important;
      transition: transform 0.35s var(--ease-spring), border-color 0.3s ease !important;
    }
    .union-emblem:hover, .icon-pill:hover {
      transform: scale(1.1) !important;
      border-color: rgba(245, 197, 24, 0.45) !important;
    }

    /* =========================================================
       ESCENARIO DEL LOGO 3D ORBITAL ULTRA FLUIDO
       ========================================================= */
    .hero-minimal {
      text-align: center !important;
      padding: 2.3rem 0 1.6rem !important;
      perspective: 900px !important;
    }

    .hero-logo-stage {
      position: relative !important;
      width: 132px !important;
      height: 132px !important;
      margin: 0 auto 1.35rem !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      transform-style: preserve-3d !important;
      cursor: pointer !important;
    }

    /* Onda de energía expansiva muy sutil */
    .logo-pulse-wave {
      position: absolute !important;
      inset: 6px !important;
      border-radius: 50% !important;
      border: 1px solid rgba(245, 197, 24, 0.45) !important;
      animation: pulseShockwave 4.2s var(--ease-out-expo) infinite !important;
      pointer-events: none !important;
    }

    @keyframes pulseShockwave {
      0% { transform: scale(0.95); opacity: 0.7; }
      75%, 100% { transform: scale(1.42); opacity: 0; }
    }

    /* Órbita exterior con punto luminoso */
    .logo-orbit-outer {
      position: absolute !important;
      inset: 0 !important;
      border-radius: 50% !important;
      border: 1px solid rgba(245, 197, 24, 0.16) !important;
      animation: orbitCW 11s linear infinite !important;
      pointer-events: none !important;
    }

    .logo-orbit-outer::before {
      content: "" !important;
      position: absolute !important;
      top: -3px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      width: 6px !important;
      height: 6px !important;
      border-radius: 50% !important;
      background: #FBE170 !important;
      box-shadow: 0 0 10px 2px rgba(245, 197, 24, 0.85) !important;
    }

    /* Órbita interior contra-rotatoria */
    .logo-orbit-inner {
      position: absolute !important;
      inset: 7px !important;
      border-radius: 50% !important;
      background: conic-gradient(
        from 0deg,
        transparent 0%,
        rgba(245, 197, 24, 0.12) 30%,
        #F5C518 50%,
        rgba(245, 197, 24, 0.12) 70%,
        transparent 100%
      ) !important;
      animation: orbitCCW 6.5s linear infinite !important;
      pointer-events: none !important;
    }

    @keyframes orbitCW { to { transform: rotate(360deg); } }
    @keyframes orbitCCW { to { transform: rotate(-360deg); } }

    /* Medallón 3D con respiración fluida */
    .logo-medallion {
      position: relative !important;
      width: 112px !important;
      height: 112px !important;
      border-radius: 50% !important;
      background: #000000 !important;
      overflow: hidden !important;
      z-index: 2 !important;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.88), 0 0 28px rgba(245, 197, 24, 0.22) !important;
      transition: transform 0.25s ease-out, box-shadow 0.35s ease !important;
      animation: smoothBreathe 5.5s ease-in-out infinite !important;
    }

    .hero-logo-stage:hover .logo-medallion {
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.9), 0 0 36px rgba(245, 197, 24, 0.42) !important;
    }

    @keyframes smoothBreathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.025); }
    }

    .hero-logo-img {
      width: 112px !important;
      height: 112px !important;
      object-fit: cover !important;
      transform: scale(1.04) !important;
    }

    /* Destello de cristal líquido */
    .logo-sheen {
      position: absolute !important;
      inset: 0 !important;
      background: linear-gradient(115deg, transparent 25%, rgba(255, 255, 255, 0.3) 50%, transparent 75%) !important;
      transform: translateX(-150%) !important;
      animation: liquidSheen 4.8s ease-in-out infinite !important;
      pointer-events: none !important;
    }

    @keyframes liquidSheen {
      0%, 55% { transform: translateX(-150%); }
      100% { transform: translateX(150%); }
    }

    .hero-subtitle { margin-left: auto !important; margin-right: auto !important; }
    .meta-bar { justify-content: center !important; }

    /* Footer logo */
    .footer-logo-wrap {
      width: 64px !important;
      height: 64px !important;
      border-radius: 50% !important;
      overflow: hidden !important;
      border: 1px solid rgba(245, 197, 24, 0.4) !important;
      background: #000 !important;
      margin: 0 auto 0.9rem !important;
      transition: transform 0.4s var(--ease-spring) !important;
    }
    .footer-logo-wrap:hover { transform: scale(1.08) rotate(-6deg) !important; }
    .footer-logo-img { width: 64px !important; height: 64px !important; object-fit: cover !important; }
  </style>
</head>
